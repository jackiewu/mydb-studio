[package]
name = "mydb-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server that lets AI tools query MyDB Studio's saved connections"

[dependencies]
mydb-core = { path = "../mydb-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
