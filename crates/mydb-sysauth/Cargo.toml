[package]
name = "mydb-sysauth"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSError", "NSNotification", "NSDistributedNotificationCenter", "NSOperation"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
