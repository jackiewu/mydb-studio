[package]
name = "mydb-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "chrono"] }
# Redis connections. Not the connection-manager feature: reconnecting is done
# here, so an SSH tunnel can be reopened too.
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
rusqlite = { version = "0.41", features = ["bundled"] }
russh = "0.64"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
