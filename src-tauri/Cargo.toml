[package]
name = "mydb-studio"
version = "0.5.0"
description = "MySQL / MariaDB client with execution records, reports and an error advisor"
authors = ["jackiewu"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "mydb_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mydb-core = { path = "../crates/mydb-core" }
mydb-mcp = { path = "../crates/mydb-mcp" }
mydb-sysauth = { path = "../crates/mydb-sysauth" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"
# In-app updates from GitHub Releases (see src/update.rs).
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

# Connection passwords go to the macOS Keychain / Windows Credential Manager.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Saving a report as PDF (WKWebView createPDF).
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKPDFConfiguration"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
