[package]
name = "mydb-studio"
version = "0.1.0"
description = "MySQL / MariaDB client with execution records, reports and an error advisor"
authors = ["jackiewu"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "mydb_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mydb-core = { path = "../crates/mydb-core" }
mydb-mcp = { path = "../crates/mydb-mcp" }
mydb-sysauth = { path = "../crates/mydb-sysauth" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"

# Connection passwords go to the macOS Keychain / Windows Credential Manager.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
